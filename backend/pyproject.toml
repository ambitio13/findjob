[project]
name = "job-search-agent-backend"
version = "0.1.0"
description = "FastAPI backend for the job search agent MVP skeleton."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "httpx>=0.27",
    "structlog>=24.2",
    "python-dotenv>=1.0",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    # Async-native Redis-backed queue runtime. Used by the worker process to
    # execute model-backed workflows outside the FastAPI request lifecycle.
    "arq>=0.26",
    # Fernet envelope for content-at-rest encryption (job_postings.jd_raw).
    "cryptography>=43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "httpx>=0.27",
]
# Real BOSS Web adapter runtime. Not required for default tests/dev — the fake
# adapter is used when ``BOSS_ADAPTER_ENABLED`` is unset. Install with:
#   pip install -e '.[boss]'
boss = [
    "playwright>=1.40",
]

[tool.setuptools]
packages = [
    "app",
    "app.api",
    "app.api.v1",
    "app.core",
    "app.db",
    "app.db.models",
    "app.db.repositories",
    "app.cache",
    "app.queue",
    "app.models_gateway",
    "app.schemas",
    "app.services",
    "app.agents",
    "app.agents.tools",
    "app.agents.prompts",
    "app.agents.prompts.templates",
    "app.integrations",
    "app.integrations.llm_providers",
    "app.platforms",
    "app.platforms.boss",
    "app.tests",
]

[tool.setuptools.package-data]
"app.agents.prompts.templates" = ["*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
