server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cap request body size. The largest legitimate payload is a JD paste or a
    # resume upload; 12 MiB is generous for those while blocking oversized
    # bodies that could exhaust backend memory.
    client_max_body_size 12m;

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service.
    # X-Forwarded-For uses $proxy_add_x_forwarded_for (appends the client's
    # IP to any existing XFF value) and X-Real-IP is set from $remote_addr.
    # The backend (uvicorn --proxy-headers) only trusts XFF coming from this
    # container's IP, so client-supplied XFF/X-Real-IP cannot poison the
    # rate-limit identity. Do NOT change these to pass through client headers.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
